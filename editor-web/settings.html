<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>설정</title></head>
<body>
  <main id="settings" aria-label="설정">
    <p>글꼴과 크기는 모든 메모에 바로 적용되며 다음 실행에도 유지됩니다.</p>
    <div class="setting-row"><span>글자 크기</span><div class="text-size" role="group" aria-label="전체 글자 크기"><button id="smaller" aria-label="글자 작게" title="모든 글자를 한 단계 작게">−</button><output id="text-size" aria-label="기준 글자 크기">15</output><button id="larger" aria-label="글자 크게" title="모든 글자를 한 단계 크게">+</button></div></div>
    <label class="setting-row"><span>편집 글꼴</span><select id="font"><option value="d2">D2 Ligature</option><option value="jetbrains">JetBrains Mono</option><option value="system">시스템 고정폭</option></select></label>
    <label class="setting-row"><span>합자 사용</span><input id="ligatures" type="checkbox" checked></label>
    <label class="setting-row"><span>줄 번호</span><input id="opt-lineNumbers" type="checkbox"></label>
    <label class="setting-row"><span>자동 줄바꿈</span><input id="opt-wordWrap" type="checkbox"></label>
    <label class="setting-row"><span>미니맵</span><input id="opt-minimap" type="checkbox"></label>
    <label class="setting-row"><span>공백 문자 표시</span><input id="opt-whitespace" type="checkbox"></label>
    <label class="setting-row"><span>괄호 색 구분</span><input id="opt-bracketColors" type="checkbox"></label>
    <label class="setting-row"><span>구역 제목 고정</span><input id="opt-stickyScroll" type="checkbox"></label>
    <div class="setting-row" id="data-folder-row" hidden><span>메모·DB 폴더</span><div class="setting-actions"><button id="open-data-folder" type="button" title="Markdown 메모(notes)와 SQLite 검색 DB(.hunmin)가 있는 폴더를 엽니다">폴더 열기</button><button id="change-data-folder" type="button" title="메모와 검색 DB를 저장할 폴더를 바꿉니다" hidden>폴더 변경</button></div></div>
    <p id="data-folder-path" hidden></p>
    <label class="setting-row" id="start-in-tray-row" hidden><span>트레이로만 시작</span><input id="start-in-tray" type="checkbox"></label>
    <div class="setting-row" id="backup-row" hidden><span>전체 백업</span><div class="setting-actions"><button id="backup" type="button" title="메모, 첨부 이미지, 휴지통을 파일 하나로 저장합니다">백업 만들기</button><button id="restore" type="button" title="백업 파일로 모든 메모를 바꾸고 앱을 다시 시작합니다">복원</button></div></div>
    <label class="setting-row" id="auto-update-row" hidden><span>자동으로 업데이트 확인</span><input id="auto-update" type="checkbox" checked></label>
    <div class="setting-row" id="update-row" hidden><span id="app-version">버전</span><button id="check-update" type="button">지금 확인</button></div>
    <p id="settings-status" role="status" hidden></p>
  </main>
  <script type="module" src="/src/settings.ts"></script>
</body>
</html>
