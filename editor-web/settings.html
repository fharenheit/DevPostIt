<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>설정</title></head>
<body>
  <main id="settings" aria-label="설정">
    <p>글꼴과 크기는 모든 메모에 바로 적용되며 다음 실행에도 유지됩니다.</p>
    <div class="setting-row"><span>글자 크기</span><div class="text-size" role="group" aria-label="전체 글자 크기"><button id="smaller" aria-label="글자 작게" title="모든 글자를 한 단계 작게">−</button><output id="text-size" aria-label="기준 글자 크기">15</output><button id="larger" aria-label="글자 크게" title="모든 글자를 한 단계 크게">+</button></div></div>
    <div class="setting-row"><span>편집기 글자 크기</span><div class="text-size" role="group" aria-label="편집기 글자 크기"><button id="editor-smaller" type="button" aria-label="편집기 글자 작게">−</button><output id="editor-size" aria-label="편집기 글자 크기 값">13</output><button id="editor-larger" type="button" aria-label="편집기 글자 크게">+</button></div></div>
    <div class="setting-row"><span>미리보기 글자 크기</span><div class="text-size" role="group" aria-label="미리보기 글자 크기"><button id="preview-smaller" type="button" aria-label="미리보기 글자 작게">−</button><output id="preview-size" aria-label="미리보기 글자 크기 값">13</output><button id="preview-larger" type="button" aria-label="미리보기 글자 크게">+</button></div></div>
    <div class="setting-row"><span>줄 간격</span><div class="text-size" role="group" aria-label="줄 간격"><button id="line-smaller" type="button" aria-label="줄 간격 좁게">−</button><output id="line-height" aria-label="줄 간격 값">1.7</output><button id="line-larger" type="button" aria-label="줄 간격 넓게">+</button></div></div>
    <label class="setting-row"><span>편집 글꼴</span><select id="font"><option value="d2">D2 Ligature</option><option value="jetbrains">JetBrains Mono</option><option value="system">Consolas</option></select></label>
    <label class="setting-row"><span>합자 사용</span><input id="ligatures" type="checkbox" checked></label>
    <label class="setting-row" id="body-font-row" hidden><span>본문 글꼴</span><select id="body-font"><option value="">기본</option></select></label>
    <pre id="font-sample" aria-label="글꼴 미리보기">가나다라 ABC abc 123
=&gt; != === -&gt; // 주석</pre>
    <div id="font-reset-row"><button id="font-reset" type="button" title="글꼴과 편집기 표시 설정을 처음 상태로 되돌립니다">기본값으로</button></div>
    <label class="setting-row"><span>줄 번호</span><input id="opt-lineNumbers" type="checkbox"></label>
    <label class="setting-row"><span>자동 줄바꿈</span><input id="opt-wordWrap" type="checkbox"></label>
    <label class="setting-row"><span>미니맵</span><input id="opt-minimap" type="checkbox"></label>
    <label class="setting-row"><span>공백 문자 표시</span><input id="opt-whitespace" type="checkbox"></label>
    <label class="setting-row"><span>괄호 색 구분</span><input id="opt-bracketColors" type="checkbox"></label>
    <label class="setting-row"><span>구역 제목 고정</span><input id="opt-stickyScroll" type="checkbox"></label>
    <div class="setting-row" id="data-folder-row" hidden><span>메모·DB 폴더</span><div class="setting-actions"><button id="open-data-folder" type="button" title="Markdown 메모(notes)와 SQLite 검색 DB(.hunmin)가 있는 폴더를 엽니다">폴더 열기</button><button id="change-data-folder" type="button" title="메모와 검색 DB를 저장할 폴더를 바꿉니다" hidden>폴더 변경</button></div></div>
    <p id="data-folder-path" hidden></p>
    <label class="setting-row" id="start-in-tray-row" hidden><span>트레이로만 시작</span><input id="start-in-tray" type="checkbox"></label>
    <label class="setting-row" id="capture-delay-row" hidden><span>캡처 전 대기</span><select id="capture-delay"><option value="0">없음</option><option value="3">3초</option><option value="5">5초</option><option value="10">10초</option></select></label>
    <label class="setting-row" id="capture-annotate-row" hidden><span>캡처 후 주석 창 열기</span><input id="capture-annotate" type="checkbox" checked></label>
    <label class="setting-row" id="holiday-updates-row" hidden><span>공휴일 정보 자동 업데이트</span><input id="holiday-updates" type="checkbox" checked></label>
    <div class="setting-row" id="clean-images-row" hidden><span>쓰지 않는 이미지</span><button id="clean-images" type="button" title="어느 메모도 쓰지 않는 이미지를 찾아 확인 후 Windows 휴지통으로 옮깁니다">정리</button></div>
    <div class="setting-row" id="backup-row" hidden><span>전체 백업</span><div class="setting-actions"><button id="backup" type="button" title="메모, 첨부 이미지, 휴지통을 파일 하나로 저장합니다">백업</button><button id="restore" type="button" title="백업 파일로 모든 메모를 바꾸고 앱을 다시 시작합니다">복원</button></div></div>
    <label class="setting-row" id="auto-update-row" hidden><span>자동으로 업데이트 확인</span><input id="auto-update" type="checkbox" checked></label>
    <div class="setting-row" id="update-row" hidden><span id="app-version">버전</span><button id="check-update" type="button">지금 확인</button></div>
    <p id="settings-status" role="status" hidden></p>
  </main>
  <script type="module" src="/src/settings.ts"></script>
</body>
</html>
